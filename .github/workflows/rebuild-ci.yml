name: Rebuild CI

on:
  push:
    branches:
      - 'design/**'
      - 'wp/**'
      - 'rebuild/**'
  pull_request:
    branches:
      - 'design/**'
      - 'rebuild/**'
  workflow_dispatch:

concurrency:
  group: rebuild-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Docker is available for Testcontainers
        run: docker version

      - name: Build and verify
        # Runs unit tests today; golden replay, signature vectors, ArchUnit and
        # Testcontainers suites join this step as their work packages land.
        run: mvn -B -ntp -U -Dgpg.skip=true verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
