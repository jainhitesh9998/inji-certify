name: Rebuild CI

on:
  push:
    branches:
      - 'design/**'
      - 'wp/**'
      - 'rebuild/**'
  pull_request:
    branches:
      - 'design/**'
      - 'rebuild/**'
  workflow_dispatch:

concurrency:
  group: rebuild-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Docker is available for Testcontainers
        run: docker version

      - name: Build and verify
        # Runs unit tests today; golden replay, signature vectors, ArchUnit and
        # Testcontainers suites join this step as their work packages land.
        run: mvn -B -ntp -U -Dgpg.skip=true verify

      - name: Independent mDoc verifier (pymdoccbor)
        # Second, non-Java opinion on every mDoc the tests write to target/mdoc-samples/ (M-01, decision D9):
        # pymdoccbor verifies the IssuerAuth COSE_Sign1 signature and the element digests. The Java harness
        # (certify-testkit-mdoc: Multipaz + Authlete) runs in the test step above.
        run: |
          python3 -m venv /tmp/pymdoccbor
          /tmp/pymdoccbor/bin/pip install --quiet pymdoccbor==1.4.0
          shopt -s nullglob
          samples=(*/target/mdoc-samples/*.mdoc)
          if [ ${#samples[@]} -eq 0 ]; then
            echo "no mDoc samples under target/mdoc-samples: the formatter test did not run"
            exit 1
          fi
          for sample in "${samples[@]}"; do
            /tmp/pymdoccbor/bin/python docs/design/tools/verify_mdoc.py "$sample"
          done
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
