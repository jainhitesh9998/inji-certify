name: Rebuild CI

on:
  push:
    branches:
      - 'design/**'
      - 'wp/**'
      - 'rebuild/**'
  pull_request:
    branches:
      - 'design/**'
      - 'rebuild/**'
  workflow_dispatch:

concurrency:
  group: rebuild-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, gates
    runs-on: ubuntu-latest
    # 75, not 60: the resolution step below may legitimately spend up to 60+120+240+480 s waiting before its fifth
    # attempt, on top of the build and the gates.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: IssuanceGoldenTest compares the mso_mdoc golden with its pinned baseline commit (ce1211ef)
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # No `cache: maven` here: setup-java saves that cache only when the job succeeds, so a job that keeps
          # failing before the tests (a snapshot repository answering 429) never saves it and never recovers. The
          # repository is restored and saved by the two explicit actions/cache steps below instead.

      # Pin Maven 3.9 (CLAUDE.md): the runner image's newer Maven rejects POM issues that 3.9 only warns about.
      - name: Maven 3.9.9
        run: |
          base=https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
          curl -fsSL "$base" -o /tmp/maven.tgz
          echo "$(curl -fsSL "$base.sha512" | cut -d' ' -f1)  /tmp/maven.tgz" | sha512sum -c -
          sudo tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: Maven version
        run: mvn -v

      - name: Restore the Maven repository cache
        id: maven-cache
        # Keyed on the pom hashes with a `-v3` suffix so these keys cannot collide with the `setup-java` ones or with
        # the older `-v2` generation, plus the run id: a save at the end of the job must never have to overwrite the key
        # it restored (a re-run of the same run id aside). Restored through the prefixes, so a pom change still starts
        # from the previous run's repository instead of an empty ~/.m2 (a cold repository is what makes the snapshot
        # fetches below fail on a 429).
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v3-${{ github.run_id }}
          restore-keys: |
            maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-v3-
            maven-${{ runner.os }}-

      - name: Docker is available for Testcontainers
        run: docker version

      - name: Resolve dependencies
        # `https://central.sonatype.com/repository/maven-snapshots` answers 429 Too Many Requests under load for
        # io.inji.verify:verify-core:1.0.0-beta.1-SNAPSHOT (pom, maven-metadata.xml), and Maven then caches the failure
        # in ~/.m2 (`... will not be reattempted until the update interval ... has elapsed or updates are forced`), so a
        # cold repository fails the job before a single test runs. Hence: up to 5 attempts with backoff, `-U` from the
        # second attempt on (to force past the cached failure), and the repository saved at the end of the job even when
        # this step fails.
        #
        # Each attempt asks for the throttled artifact alone first (`-N -Dtransitive=false dependency:get`, about a
        # second) and only then builds the reactor, so a 429 is reported in seconds instead of after the minutes
        # `test-compile` spends compiling before reaching the same fetch. Both commands are classified the same way, so
        # the rest of the resolution is not the probe's job: the artifact's own transitive dependencies are releases
        # that come from Central, and the reactor build below resolves them (and fails, and is classified, on its own).
        #
        # Goal: `test-compile`, not `install` and not `dependency:go-offline`.
        #  - `test-compile` builds the whole reactor, so no module has to fetch a sibling snapshot from a remote
        #    repository, and it resolves every compile and test-scope dependency plus the plugins bound up to that
        #    phase, without running a test.
        #  - `install` would write this build's own artifacts into ~/.m2/repository, i.e. publish the reactor
        #    snapshots into the cache saved below, where a later run could resolve a stale sibling instead of building
        #    it. (The cleanup at the top of this step also drops anything an older cache carried in.)
        #  - `dependency:go-offline` alone is known to leave plugin and test-scope dependencies unresolved.
        #
        # The runner executes this as `bash --noprofile --norc -eo pipefail`, so `-e` is already on: an untended
        # `mvn ... | tee` would end the step on the first failing attempt and the retries would never run. Hence
        # `set +e` around each pipeline and `PIPESTATUS[0]` for Maven's own status rather than tee's.
        shell: bash
        run: |
          set -uo pipefail

          # Nothing of this build belongs in a dependency cache (see the `install` note above). `test-compile` does not
          # install, so this only has to remove reactor artifacts an older cache restored.
          rm -rf "$HOME/.m2/repository/io/inji/certify"

          artifact=io.inji.verify:verify-core:1.0.0-beta.1-SNAPSHOT
          delays=(60 120 240 480)         # the delay before attempt 2, 3, 4 and 5
          attempts=$(( ${#delays[@]} + 1 ))
          log="$RUNNER_TEMP/resolve-dependencies.log"

          # Only a transport problem is worth retrying: a compile error, a missing artifact or a bad pom fails
          # identically five times and four delays later. One grep, over Maven's own `[ERROR]` lines only — a bare
          # `429` also matches `[WARNING] Could not transfer metadata ... (429)` and a source line such as `[429,17]` —
          # and never `grep | grep`, whose first grep takes SIGPIPE under `pipefail`. `Could not transfer` alone is
          # deliberately NOT an alternative: it also carries permanent failures (a JitPack 401, a PKIX error), which
          # would burn four delays to fail identically; the transient ones are named instead (a 429 or any 5xx status
          # code, a reset or refused connection, a terminated handshake, a connect or read timeout).
          retryable() {
            grep -Eq '^\[ERROR\].*(status code: (429|5[0-9]{2})|Too Many Requests|Connection reset|Connection refused|Remote host terminated the handshake|(Connect|Read) timed out)' "$log"
          }

          for attempt in $(seq 1 "$attempts"); do
            fetch=(mvn -B -ntp -N)
            if [ "$attempt" -gt 1 ]; then
              fetch+=(-U)                # force the snapshot recheck the first attempt left cached as failed
            fi
            # `-Dtransitive=false`: the probe answers one question — does the throttled host serve this artifact —
            # and that costs a pom and its metadata, about a second. Its transitive dependencies are release
            # artifacts from Central; the reactor build below resolves them, and a failure there is classified by
            # the same `retryable`. Asking for them here made the probe as slow and as failure-prone as the build it
            # is meant to precede, which is the whole point of the probe.
            fetch+=(-Dtransitive=false -Dartifact="$artifact" dependency:get)
            echo "attempt ${attempt}/${attempts}: ${fetch[*]}"
            set +e
            "${fetch[@]}" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              build=(mvn)
              if [ "$attempt" -gt 1 ]; then
                build+=(-U)
              fi
              build+=(-B -ntp -Dgpg.skip=true test-compile)
              echo "attempt ${attempt}/${attempts}: ${build[*]}"
              set +e
              "${build[@]}" 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              set -e
            fi

            if [ "$status" -eq 0 ]; then
              echo "dependency resolution succeeded on attempt ${attempt}/${attempts}"
              exit 0
            fi

            if ! retryable; then
              echo "::error::mvn exited ${status} without a transport error in the log; not retrying"
              exit "$status"
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi

            delay="${delays[$(( attempt - 1 ))]}"
            echo "transport error on attempt ${attempt}/${attempts}; waiting ${delay}s before attempt $(( attempt + 1 ))"
            sleep "$delay"
          done

          echo "::error::dependency resolution failed after ${attempts} attempts (see the log above); the snapshot repository kept answering 429 or the network kept dropping"
          exit 1

      - name: Build and verify
        # Runs unit tests today; golden replay, signature vectors, ArchUnit and
        # Testcontainers suites join this step as their work packages land.
        # No `-U`: snapshots were refreshed (and resolved) by the resolution step above.
        run: mvn -B -ntp -Dgpg.skip=true verify

      - name: certify-service runtime classpath guard
        # A test-only verifier must never change what the product ships. certify-service/runtime-classpath.txt is the
        # reviewed baseline of the resolved runtime classpath; M-01's first attempt pinned Multipaz's Kotlin 2.2.21
        # in the service for a test, which this guard now fails on (docs/design/20-mdl-issuer.md M-01).
        run: docs/design/tools/check-runtime-classpath.sh
        shell: bash

      - name: Public host guards (certify-nginx allow-list, public overlay)
        # M-12, D12: certify-nginx.conf in a throwaway nginx:stable on its own docker network, in front of a stub
        # upstream: every wallet path passes for a CF-Ray request and every keymanager, springdoc, actuator and admin
        # path (and the known evasions) is refused. Then `docker compose config` with and without
        # docker-compose.public.yaml, in both PKI profiles: certify's environment differs only by the expected keys
        # (its `environment: !override` list must follow the other files) and the network is project-private.
        run: |
          docker compose version
          docs/design/tools/check-public-guard.sh
          docs/design/tools/check-public-overlay.sh
        shell: bash

      - uses: actions/setup-node@v4
        # F-15: the offer page's behaviour check is plain Node with no npm install, so only the interpreter is set up
        with:
          node-version: '20'

      - name: Offer page behaviour (node)
        # F-15: the real certify-service/src/main/resources/static/offer/index.html is evaluated with a fake DOM and
        # asserted by behaviour (the demo-subject dropdown, its "Other" option, text-only labels, the POST body), which
        # is the regression test for the two defects review round 1 found in the page's script. No npm dependencies.
        run: node docs/design/tools/check-offer-page.mjs
        shell: bash

      - uses: actions/setup-python@v5
        # verify_mdoc.py and its pinned requirements are tested on this interpreter, not whatever the runner ships
        with:
          python-version: '3.12'

      - name: Independent mDoc verifier (pymdoccbor)
        # Second, non-Java opinion on every mDoc the tests write to target/mdoc-samples/ (M-01, decision D9).
        # The Java harness (certify-testkit-mdoc: Multipaz + Authlete) runs in the test step above; this one verifies
        # the IssuerAuth COSE_Sign1 signature, the x5chain, the element digests over the bytes as received, the
        # deviceKey and the validity window, taking the docType, the IACA, the holder key and the accepted gaps from
        # the sample's sidecar files. Gaps are problem codes (<check>:<code>), shared with the Java harness: a reported
        # problem the sidecar does not list fails, and so does a listed code of a rule this tool implements that is no
        # longer reported. Then every mutation under target/mdoc-mutations/ must fail, on the problem its .expect names.
        run: |
          python -m venv "$RUNNER_TEMP/verify-mdoc"
          py="$RUNNER_TEMP/verify-mdoc/bin/python"
          "$py" --version
          "$py" -m pip install --quiet -r docs/design/tools/requirements-verify.txt
          "$py" -m unittest discover -s docs/design/tools -p 'test_*.py'
          shopt -s nullglob
          samples=(*/target/mdoc-samples/*.mdoc)
          if [ ${#samples[@]} -eq 0 ]; then
            echo "no mDoc samples under target/mdoc-samples: the mDoc tests did not run"
            exit 1
          fi
          verify() {
            local sample="$1" base="${1%.mdoc}"
            local args=("$sample")
            if [ -f "${base}.doctype" ]; then
              args+=(--doctype "$(cat "${base}.doctype")")
            fi
            if [ -f "${base}.iaca.pem" ]; then
              args+=(--iaca "${base}.iaca.pem")
            fi
            args+=(--holder "${base}.holder.jwk" --gaps "${base}.gaps")
            "$py" docs/design/tools/verify_mdoc.py "${args[@]}"
          }
          for sample in "${samples[@]}"; do
            verify "$sample"
          done
          mutations=(*/target/mdoc-mutations/*.mdoc)
          if [ ${#mutations[@]} -eq 0 ]; then
            echo "no mDoc mutations under target/mdoc-mutations: MdocIndependentVerificationTest did not run"
            exit 1
          fi
          for mutation in "${mutations[@]}"; do
            expected="$(cat "${mutation%.mdoc}.expect")"
            set +e
            output="$(verify "$mutation")"
            status=$?
            set -e
            echo "$output"
            if [ "$status" -ne 1 ] || ! grep -qF "FAIL ${expected}:" <<< "$output"; then
              echo "the mutation $mutation must fail on ${expected} (exit $status)"
              exit 1
            fi
          done
        shell: bash

      - name: BouncyCastle 1.69 compatibility (published plugin jars)
        # Published plugin jars (mock-certify-plugin, mosip-identity-certify-plugin) bundle unshaded BouncyCastle 1.69
        # and shadow the service's 1.78 on loader.path (decision log 2026-11-13, F-10). The bc169 profile keeps the
        # 1.78 compile and runs these modules' tests with only the 1.69 jars on the test classpath; the linkage guard
        # resolves against 1.69 every BouncyCastle reference in certify-service, the Certify modules and the
        # third-party jars on its runtime classpath, with the exceptions in docs/design/tools/bc169-linkage-allowlist.txt.
        # After the mDoc verifier step on purpose: the format tests rewrite their samples.
        run: |
          mvn -B -ntp -Dgpg.skip=true -Pbc169 \
            -pl certify-pki,certify-signing,certify-keyprovider-jca,certify-keyprovider-x509-file,certify-format-mdoc -am test
          docs/design/tools/check-bc169-linkage.sh
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

      - name: Strip failure markers from the Maven repository
        # Maven records a failed fetch in ~/.m2 as `*.lastUpdated` and `resolver-status.properties`, and honours them
        # for the update interval (`will not be reattempted until ... updates are forced`). Caching those would hand the
        # 429 back to every later run that restores this cache, so the markers that RECORD AN ERROR are deleted before
        # the save. A marker that records a success is left alone: it is what stops the next run from re-fetching.
        # Reactor artifacts are dropped for the same reason `install` is not used: a later run must build its siblings,
        # not resolve them.
        if: always()
        shell: bash
        run: |
          # Nothing to strip if no attempt ever created the repository (and `grep` on a missing path would fail the job).
          [ -d ~/.m2/repository ] || exit 0
          rm -rf ~/.m2/repository/io/inji/certify

          # Both marker files record an outcome per repository and artifact, e.g.
          #   https\://central.sonatype.com/.../.lastUpdated=<epoch millis>
          #   https\://central.sonatype.com/.../.error=...status code: 429, reason phrase: Too Many Requests (429)
          # so `.error=` is the line that says the fetch failed; a marker without one records a success and stays.
          set +e
          grep -rlE '\.error=.+' --include='*.lastUpdated' --include='resolver-status.properties' ~/.m2/repository \
            | xargs -r rm -f
          status=$?
          set -e
          # grep exits 1 when no marker records an error, i.e. nothing to delete. That is the healthy case, not a
          # failure of this step, and `-e` (already on: `bash --noprofile --norc -eo pipefail`) would end it there.
          if [ "$status" -gt 1 ]; then
            echo "::error::reading the Maven repository's failure markers failed (exit $status)"
            exit "$status"
          fi

      - name: Save the Maven repository cache
        # At the end of the job and unconditionally: a repository that resolved on attempt 3 must be kept even if a
        # later step fails, and so must a partial one (both are far better than the cold start that caused the 429 in
        # the first place). The key is the one the restore step computed (`cache-primary-key`, i.e. this run's own key),
        # taken from its output rather than repeated here, so a change to the key is a change in one place only.
        # `continue-on-error` is belt and braces: reserving a key that already exists is only a warning in
        # actions/cache/save (it happens on a re-run of the same run id), and a best-effort cache must never turn a green
        # build red.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
