# The ISO/IEC 18013-5 mDL issuer (docs/design/20-mdl-issuer.md, M-10) on the rebuilt service, next to the farmer use
# case: profile "mdl" plus a PKI profile, the demo holders, and a one-shot service that writes the mDL credential
# configuration through the v2 API. On top of the base file and the rebuild overlay, with the PKI profile named:
#
#   MDL_PKI_PROFILE=mdl-dev docker compose -f docker-compose.yaml -f docker-compose.rebuild.yaml \
#       -f docker-compose.mdl.yaml up -d --no-build database certify certify-nginx mdl-seed
#
# with inji-certify:rebuild built first and loader_path/certify-mdl/ prepared (config/mdl/README.md, steps 1 and 2).
# The base file publishes 8090, 8091 and 5433 on every interface; on a public host or a shared machine add
# docker-compose.public.yaml last (loopback ports, no database port, passwords from secret files).
#
# Environment:
#   MDL_PKI_PROFILE      required, no default: mdl-dev (dev-mode IACA and DSC generated into ./data/MDL_PKI; local runs
#                        and demos) or mdl-operator (the offline certify-cli PKI from MDL_PKI_DIR; the public host)
#   CERTIFY_PUBLIC_URL   the URL wallets reach certify-nginx at: identifiers, offers, metadata, status list URLs, and in
#                        mdl-dev the IACA's issuerAltName and CRL distribution point (default http://localhost:8091; the
#                        public demo uses https://credentials.loremipsum.co.in). Changing it needs a fresh database and,
#                        in mdl-dev, a fresh ./data/MDL_PKI (config/mdl/README.md)
#   MDL_PKI_DIR          mdl-operator: host directory with issuer.p12, iaca.pem, iaca.crl (certify-cli Recipe 1)
#   CERTIFY_KEYSTORE_PASSWORD  mdl-operator without docker-compose.public.yaml: the password of issuer.p12, passed
#                        through from the shell (visible to `docker inspect`); the public overlay replaces the environment
#                        without it and reads the password from a secret file instead
#   MDL_DSC_ALIAS        mdl-operator: the Document Signer entry checked at startup (default mdl-dsc@2026-11)
#   MDL_SEED_UPDATE      true: the seed replaces an existing mDL configuration (PUT) instead of leaving it
# See config/mdl/README.md.
services:
  certify:
    environment:
      - active_profile_env=default, csvdp-farmer, rebuild, mdl, ${MDL_PKI_PROFILE:?set MDL_PKI_PROFILE to mdl-dev or mdl-operator}
      - mosip_certify_domain_url=${CERTIFY_PUBLIC_URL:-http://localhost:8091}
      # passed through from the shell only when set (mdl-operator); `docker inspect` shows it, so a shared or public host
      # uses docker-compose.public.yaml, which drops it (its certify environment is the whole list, without this) and
      # reads it from a secret file. A change to the certify environment here goes into docker-compose.public.yaml too.
      - CERTIFY_KEYSTORE_PASSWORD
      - MDL_DSC_ALIAS
    volumes:
      # Replaces the rebuild overlay's ./loader_path/certify/ with a directory holding only the jar the farmer profile
      # scans, mock-certify-plugin.jar. Its bundled BouncyCastle 1.69 no longer breaks certify-pki since F-10
      # (config/mdl/README.md, "Plugin jars"; strip it only for a pre-F-10 build).
      - ./loader_path/certify-mdl/:/home/mosip/additional_jars/:ro
      - ./config/certify-mdl.properties:/home/mosip/config/certify-mdl.properties:ro
      - ./config/certify-mdl-dev.properties:/home/mosip/config/certify-mdl-dev.properties:ro
      - ./config/certify-mdl-operator.properties:/home/mosip/config/certify-mdl-operator.properties:ro
      # holders.json and the portraits it names (the file data source "mdldemo"); read-only, see config/mdl/README.md
      - ./config/mdl:/home/mosip/config/mdl:ro
      # mdl-dev: the generated IACA and Document Signer, and the dev CRL numbers (<keystore>.crl-numbers), kept across
      # restarts; must be writable
      - ./data/MDL_PKI:/home/mosip/mdl-pki
      # mdl-operator: the issuer keystore, IACA and CRL produced offline with certify-cli; read-only
      - ${MDL_PKI_DIR:-./data/MDL_PKI_OPERATOR}:/pki:ro

  mdl-seed:
    # 8.11.1, pinned by digest (the multi-platform index)
    image: curlimages/curl:8.11.1@sha256:012fd1b212b09992bad38e2f911cac0bfbcadd0f8060fb4558fc2d74f8435a4a
    entrypoint: ["sh", "/mdl/seed.sh"]
    environment:
      - CERTIFY_URL=http://certify:8090/v1/certify
      - MDL_SEED_UPDATE=${MDL_SEED_UPDATE:-false}
    volumes:
      - ./config/mdl/seed.sh:/mdl/seed.sh:ro
      - ./config/mdl/mdl-configuration.json:/mdl/mdl-configuration.json:ro
      - ./config/mdl/mdl.vm:/mdl/mdl.vm:ro
    networks:
      - network
    depends_on:
      - certify
    restart: "no"
