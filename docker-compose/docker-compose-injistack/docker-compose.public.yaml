# Hardening for a stack that serves a public host (the mDL demo behind its tunnel, M-12) or runs on any machine others
# can reach. Last in the -f list, after docker-compose.mdl.yaml (config/mdl/README.md, "The public host"):
#
#   docker compose -f docker-compose.yaml -f docker-compose.rebuild.yaml -f docker-compose.mdl.yaml \
#       -f docker-compose.public.yaml up -d --no-build database certify certify-nginx mdl-seed
#
# Needs Docker Compose 2.24.4 or later (`!override` and `!reset`); an older Compose fails on the tags instead of
# silently keeping the base file's ports.
#
# 1. Ports. docker-compose.yaml publishes certify 8090, certify-nginx 8091 and PostgreSQL 5433 on every interface. A
#    client on the LAN could then call the admin APIs on 8090 (no guard at all) or on 8091 without CF-Ray (treated as
#    local by certify-nginx, D12), and log in to PostgreSQL. Here certify and certify-nginx listen on 127.0.0.1 only (the
#    tunnel connector runs on the host and reaches 127.0.0.1:8091), and PostgreSQL is not published.
#
# 2. Passwords. The base stack's PostgreSQL password and keymanager keystore password are the public defaults
#    (postgres, local). Here they, and the operator keystore's password, come from files in CERTIFY_SECRETS_DIR
#    (required), mounted as Compose secrets under /run/secrets/ and never as environment variables (which
#    `docker inspect` shows):
#
#      db_password                   PostgreSQL's password (POSTGRES_PASSWORD_FILE) and spring.datasource.password
#      keymanager_keystore_password  mosip.kernel.keymanager.hsm.keystore-pass (the PKCS#12 in data/CERTIFY_PKCS12)
#      keystore_password             CERTIFY_KEYSTORE_PASSWORD, the issuer.p12 password of profile mdl-operator
#
#    Certify reads its two through spring.config.import=optional:configtree:/run/secrets/ (each file name is a property
#    name, a trailing newline is dropped), which takes precedence over the properties files. PostgreSQL applies its
#    password only when it initialises an empty data directory, and keymanager creates its keystore with the password
#    of the first start: both need a fresh start (config/mdl/README.md, "The public host").
services:
  database:
    ports: !reset []
    environment: !override
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - source: db_password
        target: postgres_password

  certify:
    ports: !override
      - "127.0.0.1:8090:8090"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/
    secrets:
      - source: db_password
        target: spring.datasource.password
      - source: keymanager_keystore_password
        target: mosip.kernel.keymanager.hsm.keystore-pass
      - source: keystore_password
        target: CERTIFY_KEYSTORE_PASSWORD

  certify-nginx:
    ports: !override
      - "127.0.0.1:8091:80"

secrets:
  db_password:
    file: ${CERTIFY_SECRETS_DIR:?set CERTIFY_SECRETS_DIR to the directory with db_password, keymanager_keystore_password and keystore_password}/db_password
  keymanager_keystore_password:
    file: ${CERTIFY_SECRETS_DIR:?set CERTIFY_SECRETS_DIR}/keymanager_keystore_password
  keystore_password:
    file: ${CERTIFY_SECRETS_DIR:?set CERTIFY_SECRETS_DIR}/keystore_password
