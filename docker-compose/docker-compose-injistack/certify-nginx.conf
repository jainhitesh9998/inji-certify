# Requests that arrive through Cloudflare (the public tunnel) carry CF-Ray; the operator's own calls from the host
# (localhost:8091 or certify:8090 inside the network) do not. Admin APIs are refused for public requests
# (docs/design/20-mdl-issuer.md, decision D12).
map $http_cf_ray $certify_public_request {
    default 1;
    ""      0;
}

# What a public request may reach under /v1/certify/: an ALLOW-LIST of the wallet and verifier surface, by method and
# normalised path ($uri: percent-decoded, `.`/`..` resolved, slashes merged; the query string is not part of it). Every
# other /v1/certify/ path is refused to a public request at the server level below (403), so a controller that ends up
# on the servlet path without being listed here is never public: keymanager's (/sign, /jwtSign, /coseSign1, /encrypt,
# /decrypt, ...), springdoc (swagger-ui, v3/api-docs), actuator and the admin APIs. Paths outside /v1/certify/ (the
# root /.well-known/ and /oid4vci/ locations and the static files) are allowed as before. OPTIONS is allowed wherever
# the path is, for CORS preflight (answered 204 by nginx). Keep in step with the controllers
# (`@RequestMapping`/`@GetMapping`/`@PostMapping` in certify-service/src/main) and with
# docs/design/tools/check-public-guard.sh, which asserts both lists against a stub upstream.
map "$request_method $uri" $certify_public_allowed {
    default 0;
    # not Certify's servlet path: as before (root /.well-known/*, /oid4vci/, static files)
    "~^[A-Z]+ /(?!v1/certify/)"                                                                            1;
    # documents: issuer metadata (OpenID4VCI 1.0, draft 13 with ?version= and under /issuance), did:web, JWKS,
    # authorization server metadata
    "~^(GET|HEAD|OPTIONS) /v1/certify/\.well-known/(openid-credential-issuer|did\.json|jwks\.json|oauth-authorization-server)$" 1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/issuance/\.well-known/(openid-credential-issuer|did\.json)$"         1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/(t/[^/]+/)?oid4vci/\.well-known/openid-credential-issuer$"           1;
    # offers (the page, its scripts and the page's demo-subject list, which is the operator's configuration and never
    # the data source: F-15), status lists, rendering templates (GET; writes are admin), the IACA list, certificates and
    # CRLs (M-08), the authorization endpoint
    "~^(GET|HEAD|OPTIONS) /v1/certify/offer/?$"                                                            1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/offer/(qrcode\.min|cbor)\.js$"                                     1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/offer/demo-subjects$"                                                1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/credential-offer-data/[^/]+$"                                        1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/credentials/(status-list|token-status-list)/[^/]+$"                  1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/rendering-template/[^/]+$"                                           1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/mdoc/iaca(/[^/]+)?$"                                                 1;
    "~^(GET|HEAD|OPTIONS) /v1/certify/oauth/authorize$"                                                    1;
    # issuance: legacy and draft-13 credential (vd11, vd12), the OpenID4VCI 1.0 surface (credential, nonce,
    # notification; path tenants too), the legacy nonce, the token, PAR and interactive authorization endpoints, and
    # offer minting (public for the demo, D12; rate limited below)
    "~^(POST|OPTIONS) /v1/certify/issuance/(vd1[12]/)?credential$"                                         1;
    "~^(POST|OPTIONS) /v1/certify/(t/[^/]+/)?oid4vci/(credential|nonce|notification)$"                     1;
    "~^(POST|OPTIONS) /v1/certify/nonce$"                                                                  1;
    "~^(POST|OPTIONS) /v1/certify/oauth/(token|par|iae)$"                                                  1;
    "~^(POST|OPTIONS) /v1/certify/pre-authorized-data$"                                                    1;
}

# Rate limit for the unauthenticated issuance calls a public client can make in a loop: minting offers
# (POST /v1/certify/pre-authorized-data, public for the demo, D12), redeeming them (/v1/certify/oauth/token) and the
# pushed authorization and authorization endpoints. Only public requests are counted, keyed by the client address
# Cloudflare reports (CF-Connecting-IP; the peer address when that header is missing). Local requests get an empty key,
# which nginx does not count, so local runs and the seed are never limited. 30 requests a minute per client with a
# burst of 20; beyond that 429.
map $http_cf_connecting_ip $certify_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# The key: an IPv4 address as it is, an IPv6 address by its /64 (F-21 review round 2). One IPv6 subscriber is routinely
# given a whole /64, so keying by address would hand one caller 2^64 separate limits and let it evict offers at will.
# The /64 is the first four groups of the address with each group's leading zeros dropped. A `::` stands for as many
# zero groups as make the address eight groups long, so where it falls inside the first four groups the groups after
# it are counted (`2001::1:2:3:4:5` is 2001:0:0:1, `2001::1` is 2001:0:0:0): every spelling of one /64 is one key.
# Cloudflare sends the compressed lower-case form of RFC 5952 (`~*` matches either case). An address with a `.` (IPv4,
# or IPv4-embedded IPv6) is keyed whole. Regexes are tried in the order below and the first match wins, so a pattern
# that counts the groups after `::` comes before the shorter one it refines. check-public-guard.sh holds every row.
map $certify_client_ip $certify_client_address {
    "~\."                                                                                                                  $certify_client_ip;
    "~*^0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):"                                          "$1:$2:$3:$4::/64";
    "~*^0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4})::"                                                           "$1:$2:$3:0::/64";
    "~*^0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4})::0*([0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$"   "$1:$2:0:$3::/64";
    "~*^0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4})::"                                                                             "$1:$2:0:0::/64";
    "~*^0*([0-9a-f]{1,4})::0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$"   "$1:0:$2:$3::/64";
    "~*^0*([0-9a-f]{1,4})::0*([0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$"                     "$1:0:0:$2::/64";
    "~*^0*([0-9a-f]{1,4})::"                                                                                               "$1:0:0:0::/64";
    "~*^::0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$"  "0:$1:$2:$3::/64";
    "~*^::0*([0-9a-f]{1,4}):0*([0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$"                    "0:0:$1:$2::/64";
    "~*^::0*([0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$"                                      "0:0:0:$1::/64";
    "~^::"                                                                                                                 "0:0:0:0::/64";
    default                                                                                                                $certify_client_ip;
}
map $http_cf_ray $certify_public_limit_key {
    ""      "";
    default $certify_client_address;
}
limit_req_zone $certify_public_limit_key zone=certify_public_issuance:10m rate=30r/m;

server {
    listen 80;

    # A path parameter (`;`, encoded `%3b` or not) in a public request is refused before any location is chosen: nginx
    # matches locations on the path with `;x` kept, while Spring drops `;x` before routing, so
    # /v1/certify/v2;x/credential-configurations would pass the admin guard below as a generic /v1/certify/ request and
    # reach the admin API. Matched on the raw $request_uri up to the query string, so `?x=;` stays allowed.
    set $certify_public_path_parameter "${certify_public_request}0";
    if ($request_uri ~* "^[^?]*(;|%3b)") {
        set $certify_public_path_parameter "${certify_public_request}1";
    }
    if ($certify_public_path_parameter = "11") {
        return 403;
    }

    # The allow-list above: a public request for any other /v1/certify/ path (or method) is refused before a location
    # is chosen. The admin locations below keep their own refusal as a second layer.
    set $certify_public_guard "${certify_public_request}${certify_public_allowed}";
    if ($certify_public_guard = "10") {
        return 403;
    }

    # The site root of the public host (a request through the tunnel, CF-Ray set) is the credential offer page; a 302,
    # not a 301, so browsers do not keep it if the page moves. Local and in-stack calls (mimoto reads its config files
    # here) keep the directory listing below.
    location = / {
        # relative Location: nginx sees plain HTTP behind the tunnel, so an absolute one would say http://
        absolute_redirect off;
        if ($http_cf_ray) {
            return 302 /v1/certify/offer/;
        }
        root /config/server;
        autoindex on;
    }

    # Default location for normal static files

    location / {
        root /config/server;
        autoindex on;
    }

    # Admin APIs: configuration, key/certificate management, status updates, ledger, VC-API, and Spring Boot actuator
    # (env, configprops and heapdump would show configuration secrets and keys). Not for the public host; local calls and
    # the seed (certify:8090 directly) are unaffected. `;` after the prefix is matched too (credential-configurations;x
    # is credential-configurations to Spring).
    location ~ "^/v1/certify/(system-info|credential-configurations|v2/credential-configurations|ledger-search|vc-api|actuator)(/|;|$)" {
        if ($certify_public_request) {
            return 403;
        }
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location = /v1/certify/credentials/status {
        if ($certify_public_request) {
            return 403;
        }
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    # Rendering templates: wallets read them (GET); creating or changing one is an admin call.
    location ~ ^/v1/certify/rendering-template(/|$) {
        set $certify_template_write "${certify_public_request}${request_method}";
        if ($certify_template_write ~ "^1(POST|PUT|DELETE|PATCH)$") {
            return 403;
        }
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # IACA certificates and CRLs (M-08, decisions D12 and D15): public and read-only, so verifiers and wallets can fetch
    # the trust anchor and the CRL distribution point an mDL's Document Signer names. Certify sets Cache-Control (a CRL
    # until its nextUpdate, at most an hour); any method but GET/HEAD is refused here, and so is a path parameter (`;`,
    # matched on the raw $request_uri up to the query string, encoded or not), which nginx and Spring would read
    # differently; `;` right after `iaca` is matched here too, so such a request never falls through to the generic
    # location below. A public request with `;` is already refused (403) at the server level above.
    location ~ "^/v1/certify/mdoc/iaca([/;]|$)" {
        if ($request_uri ~* "^[^?]*(;|%3b)") {
            return 400;
        }
        limit_except GET {
            deny all;
        }
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Offer minting and the token endpoint: rate limited for public requests (limit_req_zone above), otherwise as the
    # generic location below. A trailing slash is matched too, so it cannot route around the limit. The authorization
    # endpoint is in the list because it is where a pushed request is redeemed, and every one of these paths is
    # unauthenticated to a public caller (F-21 review round 1). A body is capped at 32 KiB (413 above it), for local and
    # public callers alike: an offer is cached with its claims until it is redeemed or lapses, and the 1 MiB default
    # would let one request park a megabyte (F-21 review round 2). Certify refuses claims above
    # certify.protocol.oid4vci-v1.offers.max-claims-bytes itself (8 KiB by default), so the proxy limit is the outer
    # bound and the service's the one that decides; a token request is a few hundred bytes of form.
    location ~ "^/v1/certify/(pre-authorized-data|oauth/(token|authorize))/?$" {
        limit_req zone=certify_public_issuance burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Pushed authorization requests (RFC 9126): the same rate limit, and a body cap of its own. The request is a form
    # of client_id, redirect_uri, scope/authorization_details, PKCE challenge, state and issuer_state - a few KiB at
    # most - and every accepted one is stored until it is redeemed, so a public caller must not be able to park a 1 MiB
    # body per request in the deployment (F-21 review round 1). Matched before the location above, whose 32 KiB cap
    # leaves room for an offer's claims JSON.
    location ~ "^/v1/certify/oauth/par/?$" {
        limit_req zone=certify_public_issuance burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Proxy API requests to mimoto-service
    location /v1/certify/ {
        proxy_pass http://certify:8090/v1/certify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Handle OPTIONS requests (for pre-flight checks)
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # The rebuilt surface: its Credential Issuer Identifier is ${mosip.certify.identifier}/oid4vci, so its metadata,
    # nonce and credential endpoints live under /oid4vci/ on this host (docs/design/VALIDATE.md, section 6b)
    location /oid4vci/ {
        proxy_pass http://certify:8090/v1/certify/oid4vci/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /.well-known/did.json {
            proxy_pass http://certify:8090/v1/certify/.well-known/did.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

            # Handle OPTIONS requests (for pre-flight checks)
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        # OpenID4VCI 1.0 section 12.2.2: for a Credential Issuer Identifier with a path, the metadata lives at the path
        # formed by inserting /.well-known/openid-credential-issuer between host and path. The rebuilt surface's
        # identifier is https://<host>/v1/certify/oid4vci (a tenant's: /v1/certify/t/<tenant>/oid4vci), so wallets and the
        # conformance suite fetch these two forms; Certify serves them under its servlet path.
        location = /.well-known/openid-credential-issuer/v1/certify/oid4vci {
                    proxy_pass http://certify:8090/v1/certify/oid4vci/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    add_header 'Access-Control-Allow-Origin' '*' always;
                }
        location ~ ^/\.well-known/openid-credential-issuer/v1/certify/t/([^/]+)/oid4vci$ {
                    proxy_pass http://certify:8090/v1/certify/t/$1/oid4vci/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    add_header 'Access-Control-Allow-Origin' '*' always;
                }
        location /.well-known/openid-credential-issuer {
                    proxy_pass http://certify:8090/v1/certify/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

        location /.well-known/jwks.json {
                    proxy_pass http://certify:8090/v1/certify/.well-known/jwks.json;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

        location /.well-known/oauth-authorization-server {
                    proxy_pass http://certify:8090/v1/certify/.well-known/oauth-authorization-server;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}