server {
    listen 80;
    # Default location for normal static files

    location / {
        root /config/server;
        autoindex on;
    }

    # Proxy API requests to mimoto-service
    location /v1/certify/ {
        proxy_pass http://certify:8090/v1/certify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Handle OPTIONS requests (for pre-flight checks)
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # The rebuilt surface: its Credential Issuer Identifier is ${mosip.certify.identifier}/oid4vci, so its metadata,
    # nonce and credential endpoints live under /oid4vci/ on this host (docs/design/VALIDATE.md, section 6b)
    location /oid4vci/ {
        proxy_pass http://certify:8090/v1/certify/oid4vci/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /.well-known/did.json {
            proxy_pass http://certify:8090/v1/certify/.well-known/did.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

            # Handle OPTIONS requests (for pre-flight checks)
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        # OpenID4VCI 1.0 section 12.2.2: for a Credential Issuer Identifier with a path, the metadata lives at the path
        # formed by inserting /.well-known/openid-credential-issuer between host and path. The rebuilt surface's
        # identifier is https://<host>/v1/certify/oid4vci (a tenant's: /v1/certify/t/<tenant>/oid4vci), so wallets and the
        # conformance suite fetch these two forms; Certify serves them under its servlet path.
        location = /.well-known/openid-credential-issuer/v1/certify/oid4vci {
                    proxy_pass http://certify:8090/v1/certify/oid4vci/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    add_header 'Access-Control-Allow-Origin' '*' always;
                }
        location ~ ^/\.well-known/openid-credential-issuer/v1/certify/t/([^/]+)/oid4vci$ {
                    proxy_pass http://certify:8090/v1/certify/t/$1/oid4vci/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    add_header 'Access-Control-Allow-Origin' '*' always;
                }
        location /.well-known/openid-credential-issuer {
                    proxy_pass http://certify:8090/v1/certify/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

        location /.well-known/jwks.json {
                    proxy_pass http://certify:8090/v1/certify/.well-known/jwks.json;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

        location /.well-known/oauth-authorization-server {
                    proxy_pass http://certify:8090/v1/certify/.well-known/oauth-authorization-server;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}