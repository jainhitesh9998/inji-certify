# Profile "mdl-dev": next to "mdl", for local runs and demos. x509-file dev mode generates an ISO/IEC 18013-5 Annex B
# IACA and one Document Signer on the first start and keeps them in a keystore on the ./data/MDL_PKI volume, so the
# same IACA signs every later start. Never in production: the IACA private key lives in the service (decision D3 keeps
# it offline; use mdl-operator for that). See config/mdl/README.md.

certify.keyprovider.x509-file.dev-mode=true
# The directory must be writable: the dev CRL's numbers are kept next to the keystore (mdl-dev.p12.crl-numbers), so a
# restart publishes a CRL with a larger cRLNumber, never the same one again.
certify.keyprovider.x509-file.path=/home/mosip/mdl-pki/mdl-dev.p12
certify.keyprovider.x509-file.password=${MDL_DEV_KEYSTORE_PASSWORD:mdl-dev-only}

# The IACA (decision D2: country IN, "Demo" names). Its CRL distribution point is this issuer's publication endpoint
# under a fixed id, lorem-ipsum-demo, which names the IACA in GET /mdoc/iaca (M-08); the Document Signer copies it.
# Every start compares these settings with the IACA in the keystore and refuses to start when they differ, so a new
# CERTIFY_PUBLIC_URL needs a new dev IACA: remove ./data/MDL_PKI/mdl-dev.p12 (wallets then need the new IACA).
certify.keyprovider.x509-file.iaca.alias=iaca
certify.keyprovider.x509-file.iaca.country=IN
certify.keyprovider.x509-file.iaca.common-name=Lorem Ipsum Demo IACA
certify.keyprovider.x509-file.iaca.issuer-alt-name=${mosip.certify.domain.url}
certify.keyprovider.x509-file.iaca.crl-uri=${mosip.certify.domain.url}${server.servlet.path}/mdoc/iaca/lorem-ipsum-demo.crl
certify.keyprovider.x509-file.iaca.validity-years=5

# The Document Signer the mDL configuration signs with (signing.provider x509-file, alias mdl-dsc).
certify.keyprovider.x509-file.keys[0].alias=mdl-dsc
certify.keyprovider.x509-file.keys[0].algorithm=ES256
certify.keyprovider.x509-file.keys[0].subject=CN=Lorem Ipsum Demo DSC
certify.keyprovider.x509-file.keys[0].profile=mdoc-dsc
certify.keyprovider.x509-file.keys[0].validity-days=365
