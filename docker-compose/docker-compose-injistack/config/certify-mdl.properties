# Profile "mdl": the ISO/IEC 18013-5 mDL issuer of docs/design/20-mdl-issuer.md (M-10) on the OpenID4VCI 1.0 surface.
# Activated by docker-compose.mdl.yaml next to default, csvdp-farmer and rebuild, together with one PKI profile:
#   mdl-dev       (default) x509-file dev mode generates an Annex B IACA and Document Signer   certify-mdl-dev.properties
#   mdl-operator  the operator's offline IACA: DSC key, [DSC, IACA] chain and CRL mounted   certify-mdl-operator.properties
# The credential configuration itself is written through the v2 API by the mdl-seed service (config/mdl/).
# See config/mdl/README.md.

## ------------------------------------------- Issuer and offers ---------------------------------------------------------
# OpenID4VCI 1.0 section 12.2.4: issuer display, served by the /oid4vci metadata (and the compatibility document).
mosip.certify.credential-config.issuer.display={{'name': 'Lorem Ipsum Demo Credentials', 'locale': 'en'}}
# Offers from POST /pre-authorized-data name the /oid4vci surface unless the request says "issuer": "legacy" (D5).
certify.protocol.oid4vci-v1.offers.default-issuer=oid4vci
# Authorization server metadata: pre-authorized_grant_anonymous_access_supported=true (D13).
certify.as.pre-authorized-grant.advertise-anonymous-access=true

# Access tokens are verified with this service's own JWKS. The rebuild profile derives the URL from
# mosip.certify.domain.url, which here is the public URL (CERTIFY_PUBLIC_URL, http://localhost:8091 by default) and is
# not reachable from inside the container; fetch it over loopback instead, which also keeps a public deployment from
# hairpinning through its tunnel. Nothing outside the service sees this URL.
mosip.certify.authn.jwk-set-uri=http://localhost:${server.port}${server.servlet.path}/.well-known/jwks.json

## ------------------------------------------- Keys, trust anchors, publication ------------------------------------------
# The Document Signer is the x509-file key "mdl-dsc" (the mdl-dev or mdl-operator profile says where it comes from).
# Once that provider holds an IACA, or certify.pki.trust-anchors.mdoc-iaca lists one, the mDoc DSC policy (M-06) is
# enforced on every surface: an mDoc must be signed by a Document Signer a configured IACA issued.
certify.keyprovider.x509-file.enabled=true
# GET /v1/certify/mdoc/iaca and /mdoc/iaca/<id>.pem|.der|.crl (M-08), public and read-only through certify-nginx.
certify.pki.publication.enabled=true

## ------------------------------------------- mDoc ----------------------------------------------------------------------
# The MSO claims 30 days of validity (capped at the DSC notAfter and the mDL expiry_date; D7).
certify.format.mdoc.mso-validity=P30D

## ------------------------------------------- Holder data (D10) ---------------------------------------------------------
# Synthetic holders keyed by the access token's sub (the "subject" of the offer): mdl-demo-1..mdl-demo-3. The portrait
# files are read at startup and handed to the template as base64url. The id has no "-", so it can also be set from the
# environment (CERTIFY_DATASOURCE_FILE_SOURCES_MDLDEMO_PATH).
certify.datasource.file.sources.mdldemo.path=/home/mosip/config/mdl/holders.json
certify.datasource.file.sources.mdldemo.key-claim=sub
certify.datasource.file.sources.mdldemo.binary-fields=portrait

## ------------------------------------------- Status -------------------------------------------------------------------
# The mDL configuration asks for a Token Status List entry (status.status_list {idx, uri} in the MSO). The list is a
# statuslist+jwt signed by certify.status.token-status-list.key-ref, unset here: keymanager's EC P-256 key
# (CERTIFY_VC_SIGN_EC_R1/EC_SECP256R1_SIGN), the same signer the farmer profile's lists use. A Document Signer must not
# sign it (its extended key usage is mDL only); the CWT list signed under the IACA is M-11.
