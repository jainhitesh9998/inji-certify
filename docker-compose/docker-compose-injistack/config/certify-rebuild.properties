# Profile "rebuild": Certify acts as the authorization server for the pre-authorized code flow.
# These are the four lines certify-default.properties keeps commented under "OAuth AS Metadata Configuration".
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}
mosip.certify.authn.jwk-set-uri=${mosip.certify.authorization.url}${server.servlet.path}/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.authorization.url}${server.servlet.path}/issuance/credential' }

# Certify is its own authorization server here, so the identity data is what the credential offer carried
# (POST /pre-authorized-data claims), served by the pre-authorized data provider instead of the CSV plugin, whose
# lookups expect an eSignet subject (the CSV row id in `sub`).
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin
