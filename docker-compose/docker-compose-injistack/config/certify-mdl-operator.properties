# Profile "mdl-operator": next to "mdl", instead of mdl-dev. The IACA private key stays offline (decision D3); only the
# Document Signer key, its [DSC, IACA] chain, the IACA certificate and the IACA-signed CRL are mounted, from the host
# directory MDL_PKI_DIR at /pki (read-only). Produce them with certify-cli (config/mdl/README.md, "Operator PKI"):
#
#   /pki/mdl-dsc.key.pem   the Document Signer private key (PKCS#8 or SEC1 PEM, plaintext or encrypted)
#   /pki/dsc-chain.pem     [DSC, IACA], leaf first, as `certify pki dsc issue --out` writes it
#   /pki/iaca.pem          the IACA certificate
#   /pki/iaca.crl          the IACA's CRL (`certify pki crl issue`), served at the CRL distribution point
#
# No keystore and no dev mode: the provider holds the PEM key only, and startup fails when the key does not match the
# DSC, the chain is not exactly [DSC, IACA] or either certificate breaks Annex B.

certify.keyprovider.x509-file.dev-mode=false

certify.keyprovider.x509-file.pem-keys[0].alias=mdl-dsc
certify.keyprovider.x509-file.pem-keys[0].key=/pki/mdl-dsc.key.pem
# Only for an encrypted key: certify.keyprovider.x509-file.pem-keys[0].key-password=${MDL_DSC_KEY_PASSWORD}
certify.keyprovider.x509-file.pem-keys[0].chain=/pki/dsc-chain.pem

# The trust anchor the DSC policy checks the chain against, and the CRL GET /mdoc/iaca/lorem-ipsum-demo.crl serves.
# The id is the <id> of the IACA's CRL distribution point (`certify pki iaca create --crl-uri .../mdoc/iaca/<id>.crl`).
# A replaced iaca.crl is picked up within certify.pki.trust-anchors.crl-refresh-interval (PT5M).
certify.pki.trust-anchors.mdoc-iaca[0].id=lorem-ipsum-demo
certify.pki.trust-anchors.mdoc-iaca[0].certificate=/pki/iaca.pem
certify.pki.trust-anchors.mdoc-iaca[0].crl=/pki/iaca.crl
