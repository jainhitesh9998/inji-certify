# Profile "mdl-operator": next to "mdl", instead of mdl-dev. The IACA private key stays offline (decision D3); only what
# certify-cli writes for the deployment is mounted, read-only, from the host directory MDL_PKI_DIR at /pki
# (certify-cli/README.md Recipe 1; config/mdl/README.md "Operator PKI"):
#
#   /pki/issuer.p12   PKCS#12 holding the Document Signer key and its [DSC, IACA] chain (`pki dsc issue --generate`,
#                     alias mdl-dsc@<yyyy-MM>); password CERTIFY_KEYSTORE_PASSWORD: from the environment, or on a
#                     public host from the secret file keystore_password (docker-compose.public.yaml, read through
#                     spring.config.import=optional:configtree:/run/secrets/)
#   /pki/iaca.pem     the IACA certificate
#   /pki/iaca.crl     the IACA's CRL (`pki crl issue`), served at the CRL distribution point
#
# No dev mode: nothing is generated or written (the mount is read-only). Startup fails when the keystore lacks the
# Document Signer named below, its chain is not [DSC, IACA], either certificate breaks Annex B, or the IACA's CRL
# distribution point does not end in /mdoc/iaca/<the anchor id below>.crl. A CRL past its nextUpdate by more than
# certify.pki.stale-crl-grace (PT24H) stops mDL signing (CRL_STALE; at startup the service logs an ERROR and starts).
# Publish a new CRL into MDL_PKI_DIR before nextUpdate: it is re-read every crl-refresh-interval (PT5M).

certify.keyprovider.x509-file.dev-mode=false
certify.keyprovider.x509-file.path=/pki/issuer.p12
certify.keyprovider.x509-file.password=${CERTIFY_KEYSTORE_PASSWORD}

# Checked at startup as an Annex B Document Signer under its IACA. The configuration signs with x509-file:mdl-dsc, which
# resolves to the newest version valid now, so a rotation (`certify pki dsc rotate`) needs no change here; list the new
# version too to have it checked at startup as well.
certify.keyprovider.x509-file.keys[0].alias=${MDL_DSC_ALIAS:mdl-dsc@2026-11}
certify.keyprovider.x509-file.keys[0].algorithm=ES256
certify.keyprovider.x509-file.keys[0].profile=mdoc-dsc

# The trust anchor the DSC policy (M-06) checks every Document Signer against, and the CRL that
# GET /mdoc/iaca/lorem-ipsum-demo.crl serves. The id must be the <id> of the IACA's CRL distribution point
# (`certify pki iaca create --crl-uri https://<host>/v1/certify/mdoc/iaca/<id>.crl`), or startup is refused.
certify.pki.trust-anchors.mdoc-iaca[0].id=lorem-ipsum-demo
certify.pki.trust-anchors.mdoc-iaca[0].certificate=/pki/iaca.pem
certify.pki.trust-anchors.mdoc-iaca[0].crl=/pki/iaca.crl

# An operator whose Document Signer key is a PEM file instead (certify-cli Recipe 4, `pki dsc issue --csr` over an
# OpenSSL key) replaces path, password and keys[0] with:
#   certify.keyprovider.x509-file.pem-keys[0].alias=mdl-dsc@2026-11
#   certify.keyprovider.x509-file.pem-keys[0].key=/pki/mdl-dsc.key.pem
#   certify.keyprovider.x509-file.pem-keys[0].key-password=${MDL_DSC_KEY_PASSWORD}   (encrypted keys only)
#   certify.keyprovider.x509-file.pem-keys[0].chain=/pki/dsc-chain.pem
